<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Break Records – Video Generator</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #171a21;
        --text: #e6e6e6;
        --muted: #9aa3b2;
        --accent: #7c9cff;
        --border: #2b3140;
        --success: #6ae3a1;
        --error: #ff7b7b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .card {
        margin-top: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }
      input, select {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0f131b;
        color: var(--text);
        font-size: 15px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      button {
        padding: 12px 16px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #0b0d13;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #0f131b;
        min-height: 56px;
      }
      .status.success { border-color: var(--success); }
      .status.error { border-color: var(--error); }
      .links a { color: var(--accent); }
      .history {
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }
      .history h2 {
        margin: 0;
        font-size: 16px;
      }
      .history-list {
        display: grid;
        gap: 8px;
      }
      .history-item {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0f131b;
      }
      .history-item a { color: var(--accent); }
      .history-meta {
        min-width: 0;
        display: grid;
        gap: 2px;
      }
      .history-title {
        overflow-wrap: anywhere;
      }
      .history-date {
        color: var(--muted);
        font-size: 12px;
      }
      video {
        width: 100%;
        margin-top: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .hint { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Break Records Video Generator</h1>
        <p>Generate a short-form promo video and upload it to Google Drive.</p>
      </header>

      <div class="card">
        <form id="generator-form">
          <label>
            Artist name
            <input name="artist" placeholder="SZA" required />
          </label>

          <div class="grid">
            <label>
              Profile
              <select name="profile">
                <option value="gen_z_rnb">Gen Z R&B / Pop</option>
                <option value="millennial_indie">Millennial Indie</option>
                <option value="hype_rap">Hype Rap / Trap</option>
                <option value="pop_country">Pop Country</option>
              </select>
            </label>
            <label>
              Clip count
              <input name="clip_count" type="number" min="2" max="6" value="3" />
            </label>
            <label>
              Search limit
              <input name="search_limit" type="number" min="4" max="10" value="5" />
            </label>
            <label>
              Clip seconds
              <input name="clip_seconds" type="number" min="5" max="15" step="0.5" value="10" />
            </label>
          </div>

          <div class="grid">
            <label>
              Age range (optional)
              <input name="age_range" placeholder="18-24" />
            </label>
            <label>
              Genres (optional, comma-separated)
              <input name="genres" placeholder="R&B, Pop" />
            </label>
          </div>

          <label>
            Mood (optional)
            <input name="mood" placeholder="Aesthetic, emotional" />
          </label>

          <div class="grid">
            <label>
              Drive folder ID (optional)
              <input name="drive_folder_id" placeholder="1AbC..." />
            </label>
            <label>
              Mock overlays
              <select name="mock_overlays">
                <option value="false" selected>False</option>
                <option value="true">True</option>
              </select>
            </label>
          </div>

          <button type="submit" id="submit-btn">Generate</button>
          <div class="hint">Uses the server-side Google service account credentials to upload to Drive.</div>
        </form>
      </div>

      <div id="status" class="status">Idle.</div>
      <div id="links" class="links"></div>
      <video id="preview" controls playsinline hidden></video>
      <div id="history" class="history" hidden>
        <h2>Generated videos</h2>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <script>
      const HISTORY_DB_NAME = "break-records-video-history";
      const HISTORY_DB_VERSION = 1;
      const HISTORY_STORE_NAME = "generatedVideos";
      const MAX_HISTORY_ITEMS = 25;

      const form = document.getElementById("generator-form");
      const statusEl = document.getElementById("status");
      const linksEl = document.getElementById("links");
      const previewEl = document.getElementById("preview");
      const submitBtn = document.getElementById("submit-btn");
      const historyEl = document.getElementById("history");
      const historyListEl = document.getElementById("history-list");

      function openHistoryDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);

          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(HISTORY_STORE_NAME)) {
              db.createObjectStore(HISTORY_STORE_NAME, { keyPath: "fileId" });
            }
          };

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function withHistoryStore(mode, callback) {
        const db = await openHistoryDb();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(HISTORY_STORE_NAME, mode);
          const store = transaction.objectStore(HISTORY_STORE_NAME);
          const result = callback(store);

          transaction.oncomplete = () => {
            db.close();
            resolve(result);
          };
          transaction.onerror = () => {
            db.close();
            reject(transaction.error);
          };
        });
      }

      async function getGeneratedVideos() {
        const records = await withHistoryStore("readonly", (store) => {
          return new Promise((resolve, reject) => {
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
          });
        });

        return records.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      }

      async function saveGeneratedVideo(video) {
        const createdAt = new Date().toISOString();
        const record = { ...video, createdAt };

        await withHistoryStore("readwrite", (store) => {
          store.put(record);
        });

        const records = await getGeneratedVideos();
        const staleRecords = records.slice(MAX_HISTORY_ITEMS);
        if (staleRecords.length) {
          await withHistoryStore("readwrite", (store) => {
            staleRecords.forEach((item) => store.delete(item.fileId));
          });
        }
      }

      function renderGeneratedVideos(records) {
        historyListEl.innerHTML = "";
        historyEl.hidden = records.length === 0;

        records.forEach((record) => {
          const item = document.createElement("div");
          item.className = "history-item";

          const meta = document.createElement("div");
          meta.className = "history-meta";

          const title = document.createElement("div");
          title.className = "history-title";
          title.textContent = record.name || record.artist || "Generated video";

          const date = document.createElement("div");
          date.className = "history-date";
          date.textContent = new Date(record.createdAt).toLocaleString();

          const link = document.createElement("a");
          link.href = record.webViewLink || record.webContentLink;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "Open";

          meta.append(title, date);
          item.append(meta, link);
          historyListEl.appendChild(item);
        });
      }

      async function refreshGeneratedVideos() {
        try {
          renderGeneratedVideos(await getGeneratedVideos());
        } catch (err) {
          console.warn("Could not load generated video history.", err);
        }
      }

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = "status" + (type ? ` ${type}` : "");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        linksEl.innerHTML = "";
        previewEl.hidden = true;
        previewEl.src = "";
        setStatus("Generating video... this can take a few minutes.");

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        if (payload.mock_overlays) {
          payload.mock_overlays = payload.mock_overlays === "true";
        }
        if (payload.clip_count) payload.clip_count = Number(payload.clip_count);
        if (payload.search_limit) payload.search_limit = Number(payload.search_limit);
        if (payload.clip_seconds) payload.clip_seconds = Number(payload.clip_seconds);

        if (!payload.age_range) delete payload.age_range;
        if (!payload.genres) delete payload.genres;
        if (!payload.mood) delete payload.mood;
        if (!payload.drive_folder_id) delete payload.drive_folder_id;

        try {
          const response = await fetch("/api/generate/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setStatus(data.error || "Generation failed.", "error");
            return;
          }

          setStatus("Uploaded to Google Drive.", "success");

          const links = [];
          if (data.web_view_link) {
            links.push(`<p><a href="${data.web_view_link}" target="_blank">Open in Google Drive</a></p>`);
          }
          if (data.web_content_link) {
            links.push(`<p><a href="${data.web_content_link}" target="_blank">Direct download</a></p>`);
            previewEl.src = data.web_content_link;
            previewEl.hidden = false;
          }
          linksEl.innerHTML = links.join("");

          try {
            await saveGeneratedVideo({
              fileId: data.file_id || data.web_view_link || data.web_content_link || `${Date.now()}`,
              name: data.name,
              artist: payload.artist,
              webViewLink: data.web_view_link,
              webContentLink: data.web_content_link,
            });
            await refreshGeneratedVideos();
          } catch (err) {
            console.warn("Could not save generated video history.", err);
          }
        } catch (err) {
          setStatus("Unexpected error. Check server logs.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      refreshGeneratedVideos();
    </script>
  </body>
</html>
